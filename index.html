<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="toast"></div>
    <div class="container">
      <div class="header">
        <h2>CRUDS Operations</h2>
        <p>Product management system</p>
      </div>
      <div class="form">
        <form id="add-form">
          <input type="text" name="title" m id="title" placeholder="title" />
          <div class="price-inputs">
            <div>
              <input
                type="number"
                name="price"
                id="price"
                placeholder="price"
                min="1"
              />
            </div>
            <input
              type="number"
              name="ads"
              id="ads"
              placeholder="ads"
              min="1"
            />
            <input
              type="number"
              name="taxes"
              id="taxes"
              placeholder="taxes"
              min="1"
            />
            <input
              type="number"
              name="discount"
              id="discount"
              placeholder="discount"
              min="1"
            />
            <small id="total">0</small>
          </div>
          <input type="number" name="count" id="count" placeholder="count" />
          <input
            type="text"
            id="category"
            name="category"
            placeholder="category"
          />
          <button type="submit" id="submit-btn">Create</button>
        </form>
      </div>
      <div class="search-wrapper">
        <input
          type="text"
          placeholder="search"
          name="search"
          id="search-input"
        />
        <div class="search-buttons">
          <button id="search-by-title-btn">Search By Title</button>
          <button id="search-by-category-btn">Search By Category</button>
        </div>
      </div>
      <table class="table-wrapper">
        <thead>
          <tr>
            <th>id</th>
            <th>title</th>
            <th>price</th>
            <th>taxes</th>
            <th>ads</th>
            <th>discount</th>
            <th>total</th>
            <th>category</th>
            <th>update</th>
            <th>delete</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
